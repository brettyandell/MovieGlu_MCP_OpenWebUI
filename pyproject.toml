[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "movieglu-mcp"
version = "0.1.0"
description = "MCP server (and OpenWebUI custom tool) exposing the MovieGlu movies/cinemas/showtimes API as chat tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
movieglu-mcp = "movieglu_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
